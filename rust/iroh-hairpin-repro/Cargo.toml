[package]
name = "iroh-hairpin-repro"
version = "0.1.0"
edition = "2021"
publish = false
description = "Two hosts behind one NAT: the dialer selects a hairpinned reflexive path that only works one way"

[dependencies]
iroh = "1"
iroh-tickets = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
