name: now_playing_widget
description: >-
  In-repo home-screen widget for mStream: album art, title, artist and
  previous / play-pause / next for the track the audio handler is on.
  Android draws it itself (RemoteViews); iOS hands the snapshot to the
  WidgetKit extension in ios/NowPlayingWidget through the App Group. Kept
  as a path plugin (not a MainActivity channel) so it auto-registers on
  every FlutterEngine, including the headless one Android Auto, a Bluetooth
  key and media resumption cold-boot — a widget wired through the activity
  would go stale after any of those.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: music.mstream.now_playing_widget
        pluginClass: NowPlayingWidgetPlugin
      ios:
        pluginClass: NowPlayingWidgetPlugin
